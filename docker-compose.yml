services:
  db:
    image: pgvector/pgvector:pg17
    container_name: llm-chat-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: llmchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  adminer:
    image: adminer
    container_name: llm-chat-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata: