<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>چت با فاند واین</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #e9eefc, #f7f3ff);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 12px;
        }
        .title {
            margin: 0 0 18px;
            font-size: 1.4em;
            font-weight: bold;
            color: #3b3b5c;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .title .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
        }
        .box {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(80, 60, 180, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .messages {
            height: 460px;
            overflow-y: auto;
            padding: 18px;
        }
        .msg {
            margin: 10px 0;
            padding: 11px 16px;
            border-radius: 14px;
            max-width: 78%;
            line-height: 1.7;
            font-size: 15px;
            animation: pop .15s ease-out;
        }
        @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .user {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            margin-inline-start: auto;
            border-bottom-left-radius: 4px;
        }
        .bot {
            background: #f1f1f6;
            color: #222;
            border-bottom-right-radius: 4px;
        }
        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 4px 2px;
        }
        .typing span {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #9ca3af;
            animation: blink 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: .25; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-3px); }
        }
        form {
            display: flex;
            border-top: 1px solid #eee;
            padding: 8px;
            gap: 8px;
        }
        input {
            flex: 1;
            border: 1px solid #e3e3ec;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
            background: #fafaff;
        }
        input:focus { border-color: #8b5cf6; }
        button {
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            padding: 0 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover { opacity: .92; }
        button:disabled { opacity: .5; cursor: default; }
    </style>
</head>
<body>

<div class="title"><span class="dot"></span> هوش مصنوعی فاند واین</div>

<div class="box">
    <div class="messages" id="messages"></div>
    <form id="form">
        <input id="input" placeholder="پیامت رو بنویس..." autocomplete="off" />
        <button id="send-btn" type="submit">ارسال</button>
    </form>
</div>

<script>
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(text, who) {
        const div = document.createElement('div');
        div.className = 'msg ' + who;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    function addTyping() {
        const div = document.createElement('div');
        div.className = 'msg bot typing-wrapper';
        div.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        sendBtn.disabled = true;

        const typingEl = addTyping();

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text})
            });
            const data = await res.json();
            typingEl.remove();
            addMessage(data.reply || 'خطا در دریافت جواب', 'bot');
        } catch (err) {
            typingEl.remove();
            addMessage('خطا در ارتباط با سرور', 'bot');
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    });
</script>
</body>
</html>
